[project]
name = "passanorte-back"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Guilherme Moraes", email = "guighm@outlook.com.br" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
passanorte-back = "passanorte_back.main:main"
dev = "passanorte_back.dev:main"
create-admin = "passanorte_back.scripts.create_admin:main"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
